lead:["Consigli pratici per chi deve fermarsi alla Clinica Mangiagalli di Milano senza averlo programmato: cosa fare subito, dove trovare l'essenziale, dove mangiare, come arrivare e come gestire auto e Area C.","Practical tips for anyone who has to stay at the Mangiagalli Clinic in Milan without having planned it: what to do first, where to find essentials, where to eat, how to get there and how to handle the car and Area C.","Des conseils pratiques pour celles et ceux qui doivent rester à la Clinique Mangiagalli de Milan sans l'avoir prévu : que faire tout de suite, où trouver l'essentiel, où manger, comment venir et comment gérer la voiture et l'Area C.","نصائح عملية لكل من يضطر إلى البقاء في عيادة مانجاغالي في ميلانو دون تخطيط مسبق: ماذا تفعل أولًا، وأين تجد الضروريات، وأين تأكل، وكيف تصل، وكيف تتعامل مع السيارة والمنطقة C.","为需要临时在米兰 Mangiagalli 医院住院的人提供实用提示：先做什么、去哪里买必需品、去哪里吃饭、怎么到达，以及开车和 Area C 怎么办。"],

s1a:["<b>Sei arrivato in auto in un giorno feriale?</b> Sei dentro Area C. Hai tempo fino a domani alle 23:59 per pagare il ticket o chiedere l'esenzione.","<b>Did you drive here on a weekday?</b> You are inside Area C. You have until 23:59 tomorrow to pay the charge or ask for the exemption.","<b>Vous êtes venu en voiture un jour de semaine ?</b> Vous êtes dans l'Area C. Vous avez jusqu'à demain 23 h 59 pour payer le ticket ou demander l'exonération.","<b>هل جئت بالسيارة في يوم عمل؟</b> أنت داخل المنطقة C. أمامك حتى الساعة 23:59 من يوم الغد لدفع الرسم أو طلب الإعفاء.","<b>工作日开车来的？</b>你已进入 Area C 收费区。最迟明天23:59前缴费或申请豁免。"],
s1b:["<b>Chiedi al personale</b> cosa serve, se l'accompagnatore può restare e quali sono gli orari di visita del reparto.","<b>Ask the staff</b> what is needed, whether a companion can stay, and the ward's visiting hours.","<b>Demandez au personnel</b> ce qu'il faut, si l'accompagnant peut rester et les horaires de visite du service.","<b>اسأل الطاقم</b> عمّا يلزم، وهل يمكن للمرافق البقاء، وما هي مواعيد الزيارة في القسم.","<b>询问医护人员</b>需要准备什么、陪护人能否留下、病房探视时间。"],
s1c:["<b>Recupera documenti e farmaci:</b> documento d'identità, tessera sanitaria, referti ed esami precedenti, elenco dei farmaci abituali.","<b>Get documents and medicines:</b> ID, health card, previous reports and test results, a list of regular medicines.","<b>Récupérez documents et médicaments :</b> pièce d'identité, carte de santé, comptes rendus et examens antérieurs, liste des médicaments habituels.","<b>أحضر الوثائق والأدوية:</b> بطاقة الهوية، البطاقة الصحية، التقارير والفحوصات السابقة، قائمة الأدوية المعتادة.","<b>准备证件和药品：</b>身份证件、医保卡、以往的病历和检查报告、日常用药清单。"],
s1d:["<b>Compra l'essenziale:</b> pigiama o camicia da notte, ciabatte, biancheria, spazzolino, dentifricio, sapone, caricabatterie.","<b>Buy the essentials:</b> pyjamas or nightdress, slippers, underwear, toothbrush, toothpaste, soap, phone charger.","<b>Achetez l'essentiel :</b> pyjama ou chemise de nuit, chaussons, sous-vêtements, brosse à dents, dentifrice, savon, chargeur.","<b>اشترِ الضروريات:</b> بيجامة أو قميص نوم، شبشب، ملابس داخلية، فرشاة ومعجون أسنان، صابون، شاحن هاتف.","<b>购买必需品：</b>睡衣或睡裙、拖鞋、内衣、牙刷、牙膏、肥皂、手机充电器。"],
s1e:["<b>Certificato di malattia INPS:</b> se chi è ricoverato lavora, chiedilo al medico al momento del ricovero o entro 24 ore. Alla dimissione non viene rilasciato.","<b>INPS sick-leave certificate:</b> if the patient is employed, ask the doctor for it on admission or within 24 hours. It cannot be issued at discharge.","<b>Certificat de maladie INPS :</b> si la personne hospitalisée travaille, demandez-le au médecin dès l'admission ou dans les 24 heures. Il ne peut pas être délivré à la sortie.","<b>شهادة المرض من INPS:</b> إذا كان المريض يعمل، اطلبها من الطبيب عند الدخول أو خلال 24 ساعة. لا يمكن إصدارها عند الخروج.","<b>INPS 病假证明：</b>如果住院者有工作，请在入院时或24小时内向医生索取。出院时无法开具。"],
s1f:["<b>Avvisa famiglia e lavoro, poi mangia qualcosa.</b> Il bar più vicino è a due minuti a piedi.","<b>Tell family and work, then eat something.</b> The nearest café is a two-minute walk.","<b>Prévenez la famille et le travail, puis mangez quelque chose.</b> Le café le plus proche est à deux minutes à pied.","<b>أبلغ العائلة والعمل، ثم تناول شيئًا.</b> أقرب مقهى على بعد دقيقتين سيرًا.","<b>通知家人和单位，然后吃点东西。</b>最近的咖啡馆步行两分钟。"],
s2sub:["Minuti a piedi dall'ingresso di via della Commenda 12. Gli orari sono indicativi: tocca Indicazioni per percorso e orari aggiornati.","Walking minutes from the entrance at via della Commenda 12. Opening hours are indicative: tap Directions for the route and current hours.","Minutes à pied depuis l'entrée de via della Commenda 12. Les horaires sont indicatifs : touchez Itinéraire pour le trajet et les horaires à jour.","الدقائق سيرًا من مدخل via della Commenda 12. المواعيد تقريبية: اضغط على الاتجاهات لمعرفة الطريق والمواعيد الحالية.","步行分钟数从 via della Commenda 12 入口算起。营业时间仅供参考，请点“路线”查看路线和最新营业时间。"],
g_in:["Dentro l'ospedale","Inside the hospital","Dans l'hôpital","داخل المستشفى","医院内"],
barin:["<b>Bar della Mangiagalli.</b> Ci si arriva anche dall'interno dell'ospedale, al piano -1 della scala D. Oltre a caffè e panini vende spazzolino, dentifricio e shampoo.","<b>The Mangiagalli café.</b> You can also reach it from inside the hospital, on floor -1 of staircase D. Besides coffee and sandwiches it sells toothbrushes, toothpaste and shampoo.","<b>Le bar de la Mangiagalli.</b> On y accède aussi de l'intérieur de l'hôpital, au niveau -1 de l'escalier D. En plus du café et des sandwichs, il vend brosses à dents, dentifrice et shampoing.","<b>مقهى مانجاغالي.</b> يمكن الوصول إليه أيضًا من داخل المستشفى، في الطابق ‎-1 من الدرج D. إضافة إلى القهوة والسندويشات يبيع فرش الأسنان والمعجون والشامبو.","<b>Mangiagalli 院内咖啡吧。</b>也可从医院内部到达：D 号楼梯 -1 层。除咖啡和三明治外，还出售牙刷、牙膏和洗发水。"],

n_food:["<b>Cibo in reparto.</b> L'ospedale non permette di farsi consegnare cibi o bevande dall'esterno con servizi di food delivery, né di conservare avanzi in stanza.","<b>Food on the ward.</b> The hospital does not allow food or drink to be delivered from outside by delivery services, nor leftovers to be kept in the room.","<b>Nourriture dans le service.</b> L'hôpital n'autorise pas la livraison de repas ou de boissons de l'extérieur, ni la conservation de restes dans la chambre.","<b>الطعام في القسم.</b> لا يسمح المستشفى بتوصيل الطعام أو المشروبات من الخارج عبر خدمات التوصيل، ولا بحفظ بقايا الطعام في الغرفة.","<b>病房内饮食。</b>医院不允许通过外卖服务从院外送餐或饮料，也不允许在病房内存放剩余食物。"],
s4a:["<b>Dopo le 21:</b> Carrefour Market di via Bergamo fino all'1, Farmacia Foglia fino alle 24, Farmacia Ferrarini sempre aperta.","<b>After 9 pm:</b> Carrefour Market in via Bergamo until 1 am, Farmacia Foglia until midnight, Farmacia Ferrarini always open.","<b>Après 21 h :</b> Carrefour Market de via Bergamo jusqu'à 1 h, Farmacia Foglia jusqu'à minuit, Farmacia Ferrarini toujours ouverte.","<b>بعد الساعة 9 مساءً:</b> Carrefour Market في via Bergamo حتى 1 صباحًا، Farmacia Foglia حتى منتصف الليل، Farmacia Ferrarini مفتوحة دائمًا.","<b>晚上9点后：</b>via Bergamo 的 Carrefour Market 营业至凌晨1点，Farmacia Foglia 至午夜，Farmacia Ferrarini 全天营业。"],
s4b:["<b>Domenica:</b> molti bar di via della Commenda sono chiusi. Aperti Pavè Break (fino alle 16), Poke House a pranzo, le pizzerie e i supermercati.","<b>Sunday:</b> many cafés in via della Commenda are closed. Open: Pavè Break (until 4 pm), Poke House at lunchtime, the pizzerias and the supermarkets.","<b>Dimanche :</b> beaucoup de bars de via della Commenda sont fermés. Ouverts : Pavè Break (jusqu'à 16 h), Poke House le midi, les pizzerias et les supermarchés.","<b>الأحد:</b> كثير من مقاهي via della Commenda مغلقة. المفتوح: Pavè Break (حتى 4 مساءً)، Poke House وقت الغداء، مطاعم البيتزا والسوبرماركت.","<b>周日：</b>via della Commenda 的许多咖啡馆休息。营业的有 Pavè Break（至16点）、Poke House（午餐时段）、披萨店和超市。"],
s4c:["<b>Area C:</b> sabato, domenica e festivi non si paga.","<b>Area C:</b> no charge on Saturdays, Sundays and public holidays.","<b>Area C :</b> gratuit le samedi, le dimanche et les jours fériés.","<b>المنطقة C:</b> لا رسوم أيام السبت والأحد والعطلات الرسمية.","<b>Area C：</b>周六、周日和公共假日不收费。"],
s4d:["<b>Mezzi di notte:</b> linee sostitutive NM1, NM2 e NM3 alla fermata Sforza-Policlinico.","<b>Night transport:</b> night bus lines NM1, NM2 and NM3 at the Sforza-Policlinico stop.","<b>Transports de nuit :</b> lignes de bus NM1, NM2 et NM3 à l'arrêt Sforza-Policlinico.","<b>المواصلات ليلًا:</b> خطوط الحافلات الليلية NM1 وNM2 وNM3 عند موقف Sforza-Policlinico.","<b>夜间交通：</b>夜班巴士 NM1、NM2、NM3，在 Sforza-Policlinico 站。"],
s5sub:["La Mangiagalli è dentro Area C, la zona a traffico limitato del centro di Milano.","The Mangiagalli is inside Area C, the restricted traffic zone of central Milan.","La Mangiagalli se trouve dans l'Area C, la zone à circulation restreinte du centre de Milan.","تقع مانجاغالي داخل المنطقة C، وهي منطقة المرور المقيّد في وسط ميلانو.","Mangiagalli 位于 Area C，即米兰市中心的交通限行收费区。"],

v_dl:["ore 23:59 del giorno dopo l'ingresso<br><i style=\"font-weight:400;font-size:14px\">Esempio: entri lunedì alle 10:00 → paghi entro martedì alle 23:59</i>","23:59 on the day after you enter<br><i style=\"font-weight:400;font-size:14px\">Example: you enter on Monday at 10:00 → pay by Tuesday at 23:59</i>","23 h 59 le lendemain de l'entrée<br><i style=\"font-weight:400;font-size:14px\">Exemple : entrée le lundi à 10 h → paiement avant mardi 23 h 59</i>","الساعة 23:59 من اليوم التالي للدخول<br><i style=\"font-weight:400;font-size:14px\">مثال: تدخل يوم الاثنين الساعة 10:00 ← تدفع قبل الساعة 23:59 يوم الثلاثاء</i>","进入后次日23:59前<br><i style=\"font-weight:400;font-size:14px\">例如：周一10:00进入 → 须在周二23:59前缴费</i>"],
k_lt:["Dimenticato? Entro 7 giorni, solo online su MyAreaC","Forgot? Within 7 days, online only on MyAreaC","Oublié ? Sous 7 jours, uniquement en ligne sur MyAreaC","نسيت؟ خلال 7 أيام، عبر الإنترنت فقط على MyAreaC","忘记了？7天内补缴，仅限 MyAreaC 网上办理"],
k_gr:["Ridotto, se sosti più di un'ora in un'autorimessa convenzionata: si compra alla cassa e va attivato entro le 23:59 dello stesso giorno","Reduced, if you park for over an hour in a participating garage: buy it at the till and activate it by 23:59 the same day","Réduit, si vous stationnez plus d'une heure dans un garage conventionné : à acheter à la caisse et à activer avant 23 h 59 le jour même","مخفَّض إذا ركنت أكثر من ساعة في مرآب متعاقد: يُشترى من الصندوق ويجب تفعيله قبل الساعة 23:59 من اليوم نفسه","在合作车库停车超过一小时的优惠价：在收银处购买，须在当天23:59前激活"],
s5pay:["<b>Pagare non basta: va attivato.</b> Il ticket si collega alla targa con il suo codice PIN, online o al 02 4868 4001 (tutti i giorni 7–24). Si compra online su MyAreaC, ai parcometri, nei bancomat Intesa Sanpaolo e nei punti Sisal e LIS. Con Telepass o UnipolMove, se hai attivato il servizio, l'addebito è automatico.","<b>Paying is not enough: it must be activated.</b> The charge is linked to your number plate with its PIN code, online or on 02 4868 4001 (daily 7:00–24:00). Buy it online on MyAreaC, at parking meters, at Intesa Sanpaolo cash machines and at Sisal and LIS points. With Telepass or UnipolMove, if you have activated the service, it is charged automatically.","<b>Payer ne suffit pas : il faut l'activer.</b> Le ticket se relie à la plaque avec son code PIN, en ligne ou au 02 4868 4001 (tous les jours 7 h–24 h). Il s'achète en ligne sur MyAreaC, aux parcmètres, aux distributeurs Intesa Sanpaolo et dans les points Sisal et LIS. Avec Telepass ou UnipolMove, si le service est activé, le prélèvement est automatique.","<b>الدفع وحده لا يكفي: يجب التفعيل.</b> يُربط الرسم بلوحة السيارة عبر رمز PIN، عبر الإنترنت أو على الرقم 02 4868 4001 (يوميًا 7:00–24:00). يُشترى عبر الإنترنت على MyAreaC، أو من عدادات المواقف، أو صرافات Intesa Sanpaolo، أو نقاط Sisal وLIS. مع Telepass أو UnipolMove، إذا فعّلت الخدمة، يُخصم المبلغ تلقائيًا.","<b>仅付款不够，还必须激活。</b>用通行券上的 PIN 码将其绑定车牌，可在网上或拨打 02 4868 4001（每天7:00–24:00）办理。可在 MyAreaC 网上、停车咪表、Intesa Sanpaolo 自动取款机以及 Sisal 和 LIS 网点购买。使用 Telepass 或 UnipolMove 并已开通该服务的，会自动扣费。"],
s5ex:["<b>Esenzione.</b> Il Comune esenta dal ticket le auto usate per portare una persona al Pronto Soccorso e quelle dei genitori di neonati in terapia intensiva neonatale. Si chiede con il Modulo 06, da inviare a mta.ufficioAreaC@comune.milano.it entro le 23:59 del giorno dopo l'ingresso. Conserva il verbale del Pronto Soccorso.","<b>Exemption.</b> The City exempts cars used to take someone to the Emergency Department, and those of parents of newborns in neonatal intensive care. Request it with Form 06 (Modulo 06), emailed to mta.ufficioAreaC@comune.milano.it by 23:59 on the day after entry. Keep the Emergency Department report.","<b>Exonération.</b> La Ville exonère les voitures utilisées pour conduire une personne aux urgences et celles des parents de nouveau-nés en soins intensifs néonatals. La demande se fait avec le formulaire 06 (Modulo 06), à envoyer à mta.ufficioAreaC@comune.milano.it avant 23 h 59 le lendemain de l'entrée. Conservez le compte rendu des urgences.","<b>الإعفاء.</b> تعفي البلدية السيارات المستخدمة لنقل شخص إلى الطوارئ وسيارات آباء المواليد في العناية المركزة لحديثي الولادة. يُطلب بالنموذج 06 (Modulo 06) ويُرسل إلى mta.ufficioAreaC@comune.milano.it قبل الساعة 23:59 من اليوم التالي للدخول. احتفظ بتقرير الطوارئ.","<b>豁免。</b>送人到急诊的车辆，以及新生儿重症监护患儿父母的车辆，可免缴通行费。需填写 06 号表格（Modulo 06），在进入次日23:59前发送至 mta.ufficioAreaC@comune.milano.it。请保留急诊记录。"],
s5ban:["Le auto più inquinanti non possono entrare neanche pagando: verifica la targa sul sito del Comune.","The most polluting cars cannot enter even by paying: check your plate on the City website.","Les voitures les plus polluantes ne peuvent pas entrer, même en payant : vérifiez votre plaque sur le site de la Ville.","السيارات الأكثر تلويثًا لا يُسمح لها بالدخول حتى مع الدفع: تحقق من لوحتك على موقع البلدية.","高排放车辆即使缴费也不得进入：请在市政府网站查询车牌。"],

d_park:["Angolo via della Commenda. 3 € l'ora per le prime 4 ore, poi 1 € l'ora, massimo 24 € al giorno. Convenzionato: alla cassa vendono il ticket Area C a 4,50 €.","Corner of via della Commenda. €3 an hour for the first 4 hours, then €1 an hour, €24 a day at most. Participating garage: the till sells the Area C charge at €4.50.","Angle via della Commenda. 3 € l'heure les 4 premières heures, puis 1 € l'heure, 24 € par jour maximum. Conventionné : la caisse vend le ticket Area C à 4,50 €.","عند زاوية via della Commenda. 3 يورو للساعة في أول 4 ساعات، ثم 1 يورو للساعة، بحد أقصى 24 يورو في اليوم. مرآب متعاقد: يُباع رسم المنطقة C عند الصندوق بـ 4.50 يورو.","位于 via della Commenda 路口。前4小时每小时3欧元，之后每小时1欧元，每天最高24欧元。合作车库：收银处出售4.50欧元的 Area C 通行费。"],
s5next:["Nei giorni successivi conviene lasciare l'auto fuori dal centro e arrivare in metropolitana.","On the following days it is easier to leave the car outside the centre and come by metro.","Les jours suivants, mieux vaut laisser la voiture hors du centre et venir en métro.","في الأيام التالية الأفضل ترك السيارة خارج وسط المدينة والقدوم بالمترو.","之后几天建议把车停在市中心外，乘地铁前来。"],

r_mxp:["Treno Malpensa Express fino a Cadorna; M1 direzione Sesto FS fino a San Babila; M4 direzione San Cristoforo, fermata Sforza-Policlinico. Oppure treno fino a Centrale e M3 direzione San Donato, fermata Crocetta.","Malpensa Express train to Cadorna; M1 towards Sesto FS to San Babila; M4 towards San Cristoforo, get off at Sforza-Policlinico. Or train to Centrale and M3 towards San Donato, get off at Crocetta.","Train Malpensa Express jusqu'à Cadorna ; M1 direction Sesto FS jusqu'à San Babila ; M4 direction San Cristoforo, arrêt Sforza-Policlinico. Ou train jusqu'à Centrale puis M3 direction San Donato, arrêt Crocetta.","قطار Malpensa Express حتى Cadorna؛ ثم M1 باتجاه Sesto FS حتى San Babila؛ ثم M4 باتجاه San Cristoforo، محطة Sforza-Policlinico. أو القطار حتى Centrale ثم M3 باتجاه San Donato، محطة Crocetta.","乘 Malpensa Express 列车到 Cadorna；换 M1（Sesto FS 方向）到 San Babila；再换 M4（San Cristoforo 方向），在 Sforza-Policlinico 站下车。或乘列车到 Centrale，换 M3（San Donato 方向），在 Crocetta 站下车。"],

s8a:["<b>A Casa Lontani da Casa:</b> rete di alloggi a costo contenuto per pazienti e familiari che vengono a Milano per cure. Il Policlinico aderisce al progetto.","<b>A Casa Lontani da Casa:</b> a network of low-cost accommodation for patients and relatives who come to Milan for treatment. The hospital takes part in the project.","<b>A Casa Lontani da Casa :</b> réseau d'hébergements à prix modéré pour les patients et les proches qui viennent se faire soigner à Milan. L'hôpital participe au projet.","<b>A Casa Lontani da Casa:</b> شبكة مساكن منخفضة التكلفة للمرضى وذويهم القادمين إلى ميلانو للعلاج. المستشفى مشارك في المشروع.","<b>A Casa Lontani da Casa：</b>为来米兰就医的患者及家属提供的平价住宿网络。医院参与该项目。"],
s8b:["<b>Hotel e appartamenti:</b> in via della Commenda e corso di Porta Vigentina ci sono diverse strutture a pochi minuti a piedi. Non sono convenzionate con l'ospedale.","<b>Hotels and apartments:</b> there are several in via della Commenda and corso di Porta Vigentina, a few minutes' walk away. They have no agreement with the hospital.","<b>Hôtels et appartements :</b> il y en a plusieurs via della Commenda et corso di Porta Vigentina, à quelques minutes à pied. Ils ne sont pas conventionnés avec l'hôpital.","<b>الفنادق والشقق:</b> يوجد عدد منها في via della Commenda وcorso di Porta Vigentina على بعد دقائق سيرًا. لا يوجد اتفاق بينها وبين المستشفى.","<b>酒店和公寓：</b>via della Commenda 和 corso di Porta Vigentina 有多家，步行几分钟。它们与医院没有合作协议。"],
s8c:["<b>In reparto:</b> chiedi al personale se l'accompagnatore può fermarsi la notte.","<b>On the ward:</b> ask the staff whether a companion can stay overnight.","<b>Dans le service :</b> demandez au personnel si l'accompagnant peut rester la nuit.","<b>في القسم:</b> اسأل الطاقم هل يمكن للمرافق المبيت.","<b>病房内：</b>请询问医护人员陪护人能否过夜。"],
s9sub:["Dal foglio «Regole di accesso dei visitatori» affisso in reparto (revisione del 4 maggio 2023). Le regole possono cambiare: chiedi sempre conferma in reparto.","From the «Visitor access rules» sheet posted on the ward (revision of 4 May 2023). Rules can change: always confirm with the ward.","D'après la fiche « Règles d'accès des visiteurs » affichée dans le service (révision du 4 mai 2023). Les règles peuvent changer : demandez toujours confirmation au service.","من ورقة «قواعد دخول الزوار» المعلّقة في القسم (مراجعة 4 مايو 2023). قد تتغير القواعد: تأكد دائمًا من القسم.","依据病房张贴的《访客探视规定》（2023年5月4日修订版）。规定可能变动，请务必向病房确认。"],

s10ps:["Pronto Soccorso ostetrico-ginecologico: Clinica Mangiagalli, via della Commenda 12, aperto 24 ore su 24.","Obstetric and gynaecological Emergency Department: Mangiagalli Clinic, via della Commenda 12, open 24 hours a day.","Urgences obstétricales et gynécologiques : Clinique Mangiagalli, via della Commenda 12, ouvertes 24 h/24.","طوارئ النساء والتوليد: عيادة مانجاغالي، via della Commenda 12، مفتوحة على مدار 24 ساعة.","妇产科急诊：Mangiagalli 医院，via della Commenda 12，24小时开放。"],
s5what:["Area C è la zona a traffico limitato del centro di Milano, e la Mangiagalli è dentro. Non ci sono sbarre: le telecamere ai varchi leggono la targa. Se entri in auto quando Area C è attiva devi pagare un ticket giornaliero, anche dopo essere entrato.","Area C is the restricted traffic zone of central Milan, and the Mangiagalli is inside it. There are no barriers: cameras at the entrances read your number plate. If you drive in while Area C is active you must pay a daily charge, which can also be paid after entering.","L'Area C est la zone à circulation restreinte du centre de Milan, et la Mangiagalli s'y trouve. Il n'y a pas de barrières : des caméras lisent la plaque aux entrées. Si vous entrez en voiture pendant les heures d'activation, vous devez payer un ticket journalier, même après être entré.","المنطقة C هي منطقة المرور المقيّد في وسط ميلانو، ومانجاغالي تقع داخلها. لا توجد حواجز: الكاميرات عند المداخل تقرأ لوحة السيارة. إذا دخلت بالسيارة خلال ساعات تفعيل المنطقة C فعليك دفع رسم يومي، ويمكن الدفع بعد الدخول أيضًا.","Area C 是米兰市中心的交通限行收费区，Mangiagalli 就在区内。入口没有栏杆：摄像头会识别车牌。在 Area C 生效时段开车进入，必须缴纳每日通行费，也可以在进入之后补缴。"],
s5fine:["<b>Se non paghi.</b> Passati i 7 giorni arriva a casa del proprietario dell'auto una multa di 83 € più spese di notifica e il ticket non pagato: circa 110 € in tutto.","<b>If you don't pay.</b> After the 7 days a fine is sent to the car owner's home: €83 plus notification costs and the unpaid charge, about €110 in total.","<b>Si vous ne payez pas.</b> Passé le délai de 7 jours, une amende est envoyée au domicile du propriétaire du véhicule : 83 € plus les frais de notification et le ticket impayé, environ 110 € au total.","<b>إذا لم تدفع.</b> بعد انقضاء الأيام السبعة تُرسل إلى عنوان مالك السيارة غرامة قدرها 83 يورو، إضافة إلى رسوم الإخطار والرسم غير المدفوع: نحو 110 يورو إجمالًا.","<b>如果不缴费。</b>超过7天后，罚单会寄到车主住址：83欧元，另加通知费用和未缴的通行费，合计约110欧元。"],

s6f:["<b>Tariffe taxi:</b> da Malpensa tariffa fissa 114 €; da Orio al Serio tariffa fissa 128 €; da Linate a tassametro, in genere 20–35 €; in città a tassametro.","<b>Taxi fares:</b> from Malpensa a fixed fare of €114; from Orio al Serio a fixed fare of €128; from Linate on the meter, usually €20–35; within the city on the meter.","<b>Tarifs des taxis :</b> depuis Malpensa, forfait de 114 € ; depuis Orio al Serio, forfait de 128 € ; depuis Linate, au compteur, en général 20–35 € ; en ville, au compteur.","<b>أسعار سيارات الأجرة:</b> من مالبينسا سعر ثابت 114 يورو؛ من أوريو آل سيريو سعر ثابت 128 يورو؛ من ليناتي بالعداد، عادةً 20–35 يورو؛ داخل المدينة بالعداد.","<b>出租车费用：</b>从 Malpensa 机场固定价114欧元；从 Orio al Serio 机场固定价128欧元；从 Linate 机场打表，一般20–35欧元；市内打表计费。"],

f1:["<b>Chi ha scritto questa guida.</b> Familiari di una paziente, dopo un ricovero non programmato. Non è un documento del Policlinico di Milano e non è stata approvata dall'ospedale. Nessun esercizio citato ha pagato per comparire.","<b>Who wrote this guide.</b> Relatives of a patient, after an unplanned hospital stay. It is not a document of the Policlinico di Milano and has not been approved by the hospital. No business listed paid to appear.","<b>Qui a écrit ce guide.</b> Des proches d'une patiente, après une hospitalisation non prévue. Ce n'est pas un document du Policlinico di Milano et il n'a pas été approuvé par l'hôpital. Aucun commerce cité n'a payé pour y figurer.","<b>من كتب هذا الدليل.</b> أقارب إحدى المريضات بعد دخول غير مخطط للمستشفى. ليس وثيقة صادرة عن Policlinico di Milano ولم يعتمده المستشفى. لم يدفع أي متجر مذكور مقابل ظهوره.","<b>本指南由谁撰写。</b>一位患者的家属，在一次计划外住院之后写成。本指南不是 Policlinico di Milano 的文件，也未经医院批准。所列商家均未付费。"],
f2:["<b>Quanto è affidabile.</b> Orari di visita, Area C e trasporti vengono dai siti del Policlinico, del Comune di Milano e di ATM. Orari dei negozi e tempi a piedi sono indicativi. Per ogni dubbio vale quello che dice il personale del reparto.","<b>How reliable it is.</b> Visiting hours, Area C and transport come from the websites of the hospital, the City of Milan and ATM. Shop hours and walking times are indicative. If in doubt, what the ward staff say prevails.","<b>Fiabilité.</b> Horaires de visite, Area C et transports proviennent des sites de l'hôpital, de la Ville de Milan et d'ATM. Les horaires des commerces et les temps à pied sont indicatifs. En cas de doute, ce que dit le personnel du service prévaut.","<b>مدى الموثوقية.</b> مواعيد الزيارة والمنطقة C والمواصلات مأخوذة من مواقع المستشفى وبلدية ميلانو وATM. مواعيد المتاجر وأوقات السير تقريبية. عند الشك، يُعتمد ما يقوله طاقم القسم.","<b>可靠程度。</b>探视时间、Area C 和交通信息来自医院、米兰市政府和 ATM 官网。商店营业时间和步行时间仅供参考。如有疑问，以病房工作人员的说法为准。"],

}
